# game.waystead.co.uk, behind the edge Caddy (which terminates TLS).
# The Waystead Game home page is at /, its files under /home-assets/;
# games live under their own path (/spellbright/, /wordbright/).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Waystead Game home page (hub/site, mounted at /usr/share/nginx/hub).
    location = / {
        root /usr/share/nginx/hub;
        try_files /index.html =404;
        gzip on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
    # The nginx image's own welcome page sits in the html root: never show it.
    location = /index.html { return 301 /; }
    location /home-assets/ {
        root /usr/share/nginx/hub;
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # Pictures and video: cache for a week.
        location ~* \.(webp|png|webm|mp4)$ {
            expires 7d;
            add_header Cache-Control "public" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        }
    }

    location = /spellbright { return 301 /spellbright/; }

    location /spellbright/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Pictures, audio and fonts don't change once published: cache for a week.
    location ~ ^/spellbright/assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Wordbright: a preview behind a password, kept out of search engines.
    # At launch, delete the two auth_basic lines (README).
    location = /wordbright { return 301 /wordbright/; }

    location /wordbright/ {
        auth_basic "Wordbright preview";
        auth_basic_user_file /etc/nginx/wordbright.htpasswd;
        try_files $uri $uri/ =404;
        gzip on;
        gzip_vary on;
        gzip_types application/octet-stream application/json text/css application/javascript image/svg+xml;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Word graphs: binary, not in mime.types. Password and headers carry over.
        location ~ \.dawg$ {
            types { }
            default_type application/octet-stream;
        }
        location ~ \.webmanifest$ {
            types { }
            default_type application/manifest+json;
        }
    }

    # The old address (until 28 Oct 2026). Its service worker is replaced by
    # one that cleans up and moves open tabs over; everything else redirects.
    location = /hangman/sw.js {
        alias /usr/share/nginx/retired/hangman-sw.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /hangman { return 301 /spellbright/; }
    location ~ ^/hangman(/.*)?$ { return 301 /spellbright$1; }

    location ~ /\. { deny all; }
}
