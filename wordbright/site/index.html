<!doctype html>
<html lang="en-GB">
<head>

  <script src="js/theme-boot.js"></script>
  <!-- The name below is only for link previews and no-JavaScript visitors; the app takes it from BRAND in js/brand.js. -->
  <title>Wordbright by Waystead</title>
  <meta name="description" content="A word-tile board game for 11+ practice. Make words, find the bonus squares and learn the school spelling words.">

</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar__inner">
      <button type="button" class="iconbtn topbar__back" id="back" aria-label="Go back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <a class="brand" href="#/" id="brand">
        <svg class="brand__mark" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M16 34 L34 70 L50 26 L66 70 L84 34" class="brand__stroke"/>
          <circle cx="50" cy="20" r="7.5" class="brand__dot"/>
        </svg>
        <span class="brand__words">
          <span class="brand__name" data-brand="maker"></span>
          <span class="brand__product" data-brand="product"></span>
        </span>
      </a>
      <nav class="topbar__nav" aria-label="Main">
        <a href="#/new">New game</a>
        <a href="#/rules">How to play</a>
        <a href="#/about">For parents</a>
      </nav>
      <button type="button" class="iconbtn" id="theme" aria-label="Theme: match device. Change theme">
        <svg class="ico-auto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" class="fill"/></svg>
        <svg class="ico-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <noscript>
      <section class="wrap prose">
        <h1>This game needs JavaScript</h1>
        <p>It is a word-tile board game for 11+ practice. Turn on JavaScript in your browser to play.</p>
      </section>
    </noscript>
  </main>

  <footer class="foot">
    <div class="wrap foot__inner">
      <p><a href="https://waystead.co.uk" data-brand="partof"></a> · <a href="#/about">For parents</a></p>

    </div>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
