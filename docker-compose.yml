# game.waystead.co.uk — static, read-only nginx behind the edge Caddy
# (waystead-server/infra/caddy). No secrets, no database.
#
#   docker compose up -d
#
# Caddy reaches it by container name on the shared external network `web`,
# the same way as the parent site (waystead-parent-web).
services:
  web:
    image: nginx:1.27-alpine
    container_name: waystead-game-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ./site:/usr/share/nginx/html/spellbright:ro
      # Wordbright preview, behind a password until launch (see README).
      - ./wordbright/site:/usr/share/nginx/html/wordbright:ro
      - /home/ubuntu/waystead-secrets/wordbright.htpasswd:/etc/nginx/wordbright.htpasswd:ro
      - ./retired:/usr/share/nginx/retired:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [web]

networks:
  web:
    external: true
